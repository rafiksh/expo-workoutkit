plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.workoutkit'
version = '0.2.0'

android {
  namespace "expo.modules.workoutkit"
  defaultConfig {
    versionCode 2
    versionName "0.2.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Fused GPS for the run recorder.
  implementation "com.google.android.gms:play-services-location:21.3.0"
  // The route map (RunMapView). Needs com.google.android.geo.API_KEY in the
  // app manifest; the config plugin writes it from `googleMapsApiKey`.
  implementation "com.google.android.gms:play-services-maps:19.0.0"
  // Health Connect: the Android twin of HealthKit for both the write
  // (recorder) and read (import) sides.
  implementation "androidx.health.connect:connect-client:1.1.0"
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
